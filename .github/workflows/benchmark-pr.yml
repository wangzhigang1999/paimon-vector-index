name: PR benchmark

on:
  pull_request:
    branches: [main, 'release-*']
    paths:
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'tools/benchmark_pr.py'
      - 'tools/tests/test_benchmark_pr.py'
      - '.github/workflows/benchmark-pr.yml'

permissions:
  contents: read

concurrency:
  group: benchmark-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare base and PR
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out PR merge result
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out exact base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up fixed Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
        env:
          RUSTUP_TOOLCHAIN: 1.94.1

      - name: Cache Rust downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: benchmark-${{ runner.os }}-rust-1.94.1-${{ hashFiles('candidate/Cargo.lock', 'base/Cargo.lock') }}
          restore-keys: |
            benchmark-${{ runner.os }}-rust-1.94.1-

      - name: Test comparison and failure handling
        run: python3 -m unittest discover -s candidate/tools/tests -p 'test_benchmark_pr.py' -v

      - name: Build and compare both revisions
        # Stop the script before the job deadline, leaving time to publish failures.
        run: python3 candidate/tools/benchmark_pr.py --base base --candidate candidate --output results --total-timeout 1200
        env:
          RUSTUP_TOOLCHAIN: 1.94.1

      - name: Publish comparison summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark did not produce a report. Check the setup and build steps.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report and raw samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-benchmark
          overwrite: true
          path: |
            results/summary.md
            results/summary.json
            results/metadata.json
            results/build-*.log
            results/build-*.jsonl
            results/raw/
          if-no-files-found: warn
          retention-days: 30

  comment:
    name: Update PR benchmark comment
    needs: compare
    # Same-repository PRs have a writable token. Fork PRs retain the read-only
    # benchmark/summary; never run candidate code with a privileged trigger.
    if: ${{ always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # This job does not check out or execute PR code. Only read the report as text.
      - name: Download benchmark report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-benchmark
          path: report

      - name: Create or update one PR comment
        uses: actions/github-script@v7
        env:
          BENCHMARK_RESULT: ${{ needs.compare.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- paimon-pr-benchmark -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) {
              core.info('Skipping stale benchmark result: PR closed or head changed.');
              return;
            }
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const path = 'report/summary.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '# PR / base benchmark failed\n\nNo comparison was produced. See the workflow logs.';
            const body = `${marker}\n[Benchmark run](${runUrl}) · ${process.env.BENCHMARK_RESULT} · attempt ${process.env.GITHUB_RUN_ATTEMPT}\n\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
